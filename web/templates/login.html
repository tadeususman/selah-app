{{define "login.html"}}
<!DOCTYPE html>
<html lang="id">
<head>
  <title>selah,</title>
  {{template "head" .}}
</head>
<body class="auth-body">

  <div class="auth-top">
    <h1 class="auth-wordmark">selah<span class="auth-dot">,</span></h1>
    <p class="auth-tagline">ruang jeda untuk merenung.</p>
  </div>

  <div class="auth-sheet">
    <h2 class="auth-sheet-title">Masuk</h2>

    {{if .Error}}<p class="form-error">{{.Error}}</p>{{end}}
    {{if .Info}}<p class="form-info">{{.Info}}</p>{{end}}

    <form method="POST" action="/login" class="auth-form-new">
      <div class="auth-field">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" required autofocus autocomplete="email">
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="auth-btn">Masuk</button>
    </form>
    <p class="auth-switch">Belum punya akun? <a href="/register">Daftar</a></p>
  </div>

</body>
</html>
{{end}}
