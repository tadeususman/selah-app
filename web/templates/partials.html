<script>
  (function() {
    var saved = localStorage.getItem('selah-theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
    var savedColor = localStorage.getItem('selah-color');
    if (savedColor && savedColor !== 'default') {
      document.documentElement.dataset.color = savedColor;
    }
    var savedFontSize = localStorage.getItem('selah-fontsize');
    if (savedFontSize && savedFontSize !== 'normal') {
      document.documentElement.dataset.fontsize = savedFontSize;
    }
  })();
</script>
<script>
  (function() {
    var loader, timer;
    // inline loading UIs (typing bubbles / plan spinner) cover these forms already
    var OWN_LOADING = ['discuss-form', 'reflect-form', 'complete-form', 'plan-form'];
    // splash: animated wordmark, once per browser session (like the todo app)
    var splashPending = false;
    try {
      if (!sessionStorage.getItem('selah-splash')) {
        sessionStorage.setItem('selah-splash', '1');
        splashPending = true;
        document.documentElement.classList.add('splash-pending');
      }
    } catch (e) {}
    function init() {
      var tpl = document.getElementById('page-loader-tpl');
      if (!tpl) { document.documentElement.classList.remove('splash-pending'); return; }
      loader = tpl.content.firstElementChild.cloneNode(true);
      document.body.appendChild(loader);
      if (splashPending) {
        var sp = tpl.content.firstElementChild.cloneNode(true);
        sp.id = 'page-splash';
        sp.classList.add('splash');
        document.body.appendChild(sp);
        document.documentElement.classList.remove('splash-pending');
        setTimeout(function() {
          sp.classList.add('splash-out');
          setTimeout(function() { sp.remove(); }, 450);
        }, 1900);
      }
    }
    function start() {
      if (!loader) return;
      clearTimeout(timer);
      // short delay so fast page loads never flash the loader
      timer = setTimeout(function() { loader.classList.add('show'); }, 350);
    }
    function stop() {
      clearTimeout(timer);
      if (loader) loader.classList.remove('show');
    }
    document.addEventListener('DOMContentLoaded', init);
    document.addEventListener('click', function(e) {
      var a = e.target.closest('a[href]');
      if (!a) return;
      var href = a.getAttribute('href');
      if (!href || href.charAt(0) === '#' || a.target === '_blank' || a.download || href.startsWith('mailto:') || href.startsWith('javascript:')) return;
      start();
    });
    document.addEventListener('submit', function(e) {
      var f = e.target;
      if (f && (OWN_LOADING.indexOf(f.id) !== -1 || document.getElementById('new-loading-thread'))) return;
      start();
    });
    window.addEventListener('pageshow', function(e) { if (e.persisted) stop(); });
  })();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/sw.js');
    });
  }
</script>
