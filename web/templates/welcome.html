{{define "welcome.html"}}
<!DOCTYPE html>
<html lang="id">
<head>
  <title>Selamat datang · selah,</title>
  {{template "head" .}}
</head>
<body class="auth-body">

  <div class="auth-top" style="flex:0;padding:36px 24px 24px">
    <h1 class="auth-wordmark">{{template "wordmark-svg"}}</h1>
    <p class="auth-tagline">ruang jeda untuk merenung.</p>
  </div>

  <div class="auth-sheet" style="flex:1;overflow-y:auto">
    <h2 class="auth-sheet-title" style="margin-bottom:6px">Halo, {{.UserName}}! 👋</h2>
    <p style="font-size:13px;color:var(--text-muted);margin:0 0 24px;line-height:1.5">Sebelum mulai, sesuaikan selah, agar terasa seperti ruangmu sendiri.</p>

    <form method="POST" action="/welcome" class="auth-form-new">

      <div class="auth-field">
        <label>Mode Tampilan</label>
        <span class="set-seg" id="welcome-mode-picker" style="display:flex;margin:6px 0 0">
          <button type="button" class="set-seg-btn" style="flex:1" data-mode="auto" onclick="pickWelcomeMode('auto')">Ikut sistem</button>
          <button type="button" class="set-seg-btn" style="flex:1" data-mode="light" onclick="pickWelcomeMode('light')">Terang</button>
          <button type="button" class="set-seg-btn" style="flex:1" data-mode="dark" onclick="pickWelcomeMode('dark')">Gelap</button>
        </span>
      </div>

      <div class="auth-field">
        <label>Tema Warna</label>
        <p style="font-size:11px;color:var(--text-muted);margin:2px 0 10px;line-height:1.4">Ketuk untuk langsung preview — halaman ini akan berubah warna.</p>
        <input type="hidden" name="theme" id="welcome-theme-input" value="default">
        <div class="theme-swatch-grid">
          <button type="button" class="theme-swatch active" data-theme-value="default" onclick="pickWelcomeTheme('default')">
            <span class="swatch-dot" style="background:#2C4468"></span>
            <span class="swatch-accent" style="background:#F0A93B"></span>
            <span class="swatch-label">Biru Laut</span>
          </button>
          <button type="button" class="theme-swatch" data-theme-value="sakura" onclick="pickWelcomeTheme('sakura')">
            <span class="swatch-dot" style="background:#B05580"></span>
            <span class="swatch-accent" style="background:#E080A0"></span>
            <span class="swatch-label">Sakura</span>
          </button>
          <button type="button" class="theme-swatch" data-theme-value="rose" onclick="pickWelcomeTheme('rose')">
            <span class="swatch-dot" style="background:#A03040"></span>
            <span class="swatch-accent" style="background:#C85060"></span>
            <span class="swatch-label">Rose</span>
          </button>
          <button type="button" class="theme-swatch" data-theme-value="lavender" onclick="pickWelcomeTheme('lavender')">
            <span class="swatch-dot" style="background:#6E5CA8"></span>
            <span class="swatch-accent" style="background:#9B87CE"></span>
            <span class="swatch-label">Lavender</span>
          </button>
          <button type="button" class="theme-swatch" data-theme-value="sage" onclick="pickWelcomeTheme('sage')">
            <span class="swatch-dot" style="background:#3D7A58"></span>
            <span class="swatch-accent" style="background:#5A9E78"></span>
            <span class="swatch-label">Sage</span>
          </button>
          <button type="button" class="theme-swatch" data-theme-value="mono" onclick="pickWelcomeTheme('mono')">
            <span class="swatch-dot" style="background:#404040"></span>
            <span class="swatch-accent" style="background:#909090"></span>
            <span class="swatch-label">Mono</span>
          </button>
        </div>
      </div>

      <div class="auth-field">
        <label>Gaya Bahasa Teman Selah</label>
        <div class="radio-group" style="margin-top:2px">
          <label class="radio-option">
            <input type="radio" name="language_style" value="casual" checked onchange="onWelcomeLangChange(this)">
            <span class="radio-option-text">Santai <span class="radio-option-desc">— pakai aku &amp; kamu</span></span>
          </label>
          <label class="radio-option">
            <input type="radio" name="language_style" value="formal" onchange="onWelcomeLangChange(this)">
            <span class="radio-option-text">Formal <span class="radio-option-desc">— pakai saya &amp; Anda</span></span>
          </label>
        </div>
      </div>

      <button type="submit" class="auth-btn" style="margin-top:8px">Mulai →</button>
    </form>
  </div>

  <script>
    // Terang/gelap disimpan di perangkat (sama seperti Pengaturan → Tampilan → Mode).
    var welcomeModeChosen = false;
    function showWelcomeMode(m) {
      document.querySelectorAll('#welcome-mode-picker .set-seg-btn').forEach(function(b) {
        b.classList.toggle('active', b.dataset.mode === m);
      });
    }
    function pickWelcomeMode(m) {
      welcomeModeChosen = true;
      var t = m;
      try {
        if (m === 'auto') {
          localStorage.removeItem('selah-theme');
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } else {
          localStorage.setItem('selah-theme', m);
        }
      } catch (e) {}
      document.documentElement.dataset.theme = t;
      showWelcomeMode(m);
    }
    (function() {
      var saved = null;
      try { saved = localStorage.getItem('selah-theme'); } catch (e) {}
      showWelcomeMode(saved === 'light' || saved === 'dark' ? saved : 'auto');
    })();
    function onWelcomeLangChange(radio) {
      // Gaya formal memakai tampilan terang, kecuali user sudah memilih mode sendiri di halaman ini.
      if (radio.value === 'formal' && !welcomeModeChosen) {
        localStorage.setItem('selah-theme', 'light');
        document.documentElement.dataset.theme = 'light';
        showWelcomeMode('light');
      }
    }
    function pickWelcomeTheme(val) {
      document.getElementById('welcome-theme-input').value = val;
      document.querySelectorAll('.theme-swatch').forEach(function(el) {
        el.classList.toggle('active', el.dataset.themeValue === val);
      });
      if (val === 'default') {
        delete document.documentElement.dataset.color;
      } else {
        document.documentElement.dataset.color = val;
      }
      localStorage.setItem('selah-color', val);
    }
  </script>
</body>
</html>
{{end}}
