{{define "head"}}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Selah">
<meta name="theme-color" content="#2C4468" id="themeColorMeta">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32-light.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32-dark.png" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16-light.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16-dark.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.json">
<link rel="stylesheet" href="/static/css/style.css?v=36">
<script>
  (function() {
    var saved = localStorage.getItem('selah-theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
    var savedColor = localStorage.getItem('selah-color');
    if (savedColor && savedColor !== 'default') {
      document.documentElement.dataset.color = savedColor;
    }
    var savedFontSize = localStorage.getItem('selah-fontsize');
    if (savedFontSize && savedFontSize !== 'normal') {
      document.documentElement.dataset.fontsize = savedFontSize;
    }
  })();
</script>
<script>
  (function() {
    var bar, timer;
    function init() {
      bar = document.createElement('div');
      bar.id = 'page-progress';
      document.body.prepend(bar);
    }
    function start() {
      if (!bar) return;
      clearTimeout(timer);
      bar.style.transition = 'none';
      bar.style.width = '0%';
      bar.style.opacity = '1';
      bar.offsetWidth; // force reflow
      bar.style.transition = 'width 12s cubic-bezier(0.08, 0.04, 0, 1)';
      bar.style.width = '82%';
    }
    document.addEventListener('DOMContentLoaded', init);
    document.addEventListener('click', function(e) {
      var a = e.target.closest('a[href]');
      if (!a) return;
      var href = a.getAttribute('href');
      if (!href || href.charAt(0) === '#' || a.target === '_blank' || a.download || href.startsWith('mailto:') || href.startsWith('javascript:')) return;
      start();
    });
    document.addEventListener('submit', function() { start(); });
    window.addEventListener('pageshow', function(e) {
      if (e.persisted && bar) bar.style.opacity = '0';
    });
  })();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/sw.js');
    });
  }
</script>
{{end}}

</nav>
<div id="logout-modal" class="modal-backdrop" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal-card" style="max-width:300px;text-align:center">
    <p style="font-size:15px;font-weight:700;margin:0 0 6px;color:var(--text)">Logout?</p>
    <p style="font-size:13px;color:var(--text-muted);margin:0 0 20px;line-height:1.5">Kamu akan keluar dari sesi ini.</p>
    <div style="display:flex;gap:8px">
      <button type="button" class="modal-btn-cancel" style="flex:1;font-size:13px" onclick="document.getElementById('logout-modal').style.display='none'">Batal</button>
      <button type="button" class="btn-primary" style="flex:1;margin-top:0" onclick="document.getElementById('logout-form').submit()">Ya, Logout</button>
    </div>
  </div>
</div>

<script>
  document.querySelectorAll('.nav-item[data-path]').forEach(function(el) {
    if (window.location.pathname.startsWith(el.dataset.path)) {
      el.classList.add('active');
    }
  });

  var toggle = document.getElementById('themeToggle');
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    document.getElementById('icon-moon').style.display = t === 'dark' ? 'none' : 'block';
    document.getElementById('icon-sun').style.display = t === 'dark' ? 'block' : 'none';
  }
  applyTheme(document.documentElement.dataset.theme);
  toggle.addEventListener('click', function() {
    var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('selah-theme', next);
    applyTheme(next);
  });
  var colorMeta = document.getElementById('themeColorMeta');
  var themeColors = { default: '#2C4468', sakura: '#B05580', rose: '#A03040', lavender: '#6E5CA8', sage: '#3D7A58', mono: '#404040' };
  function applyColorTheme(c) {
    if (c && c !== 'default') {
      document.documentElement.dataset.color = c;
    } else {
      delete document.documentElement.dataset.color;
    }
    if (colorMeta) colorMeta.content = themeColors[c] || themeColors.default;
  }
  applyColorTheme(localStorage.getItem('selah-color') || 'default');
</script>
{{end}}
