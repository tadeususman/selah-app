{{define "head"}}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="selah.">
<meta name="theme-color" content="#2C4468" id="themeColorMeta">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="manifest" href="/static/manifest.json">
<link rel="stylesheet" href="/static/css/style.css">
<script>
  // Apply saved theme before page paint to avoid flash
  (function() {
    var saved = localStorage.getItem('selah-theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
  })();
</script>
{{end}}

{{define "nav"}}
<button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode" title="Ganti mode terang/gelap"></button>

<nav class="bottom-nav">
  <a href="/dashboard" class="nav-item" data-path="/dashboard">
    <span class="nav-icon">⌂</span><span>Home</span>
  </a>
  <a href="/journal" class="nav-item" data-path="/journal">
    <span class="nav-icon">▤</span><span>Journal</span>
  </a>
  <a href="/admin" class="nav-item" data-path="/admin">
    <span class="nav-icon">⚙</span><span>Pengaturan</span>
  </a>
  <form action="/logout" method="POST" class="nav-logout-form">
    <button type="submit" class="nav-item-btn">
      <span class="nav-icon">⏻</span><span>Logout</span>
    </button>
  </form>
</nav>

<script>
  // Active nav highlight
  document.querySelectorAll('.nav-item[data-path]').forEach(function(el) {
    if (window.location.pathname.startsWith(el.dataset.path)) {
      el.classList.add('active');
    }
  });

  // Theme toggle
  var toggle = document.getElementById('themeToggle');
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    toggle.textContent = t === 'dark' ? '☀️' : '🌙';
  }
  applyTheme(document.documentElement.dataset.theme);
  toggle.addEventListener('click', function() {
    var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('selah-theme', next);
    applyTheme(next);
  });
</script>
{{end}}
